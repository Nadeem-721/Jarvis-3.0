<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS 3.0</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="jarvis-container">


    <!-- Header -->
    <div class="header">

        <h1>JARVIS 3.0</h1>

        <p>Artificial Intelligence</p>

    </div>



    <!-- Status Panel -->
    <div class="status-panel">

        <div class="status-item">
            🕒
            <span id="time">03:25 PM</span>
        </div>


        <div class="status-item">
            📅
            <span id="date">06 Aug 2026</span>
        </div>


        <div class="status-item">
            🔋
            <span id="battery">85%</span>
        </div>


        <div class="status-item">
            📶 Wi-Fi
        </div>


        <div class="status-item">
            🌦 29°C
        </div>


        <div class="status-item online">
            🟢 ONLINE
        </div>

    </div>



    <!-- AI Core -->

    <div class="ai-core">


        <div class="core-circle">
            ◎
        </div>


        <h2>AI CORE</h2>


        <p id="jarvis-status">
            System ready
        </p>


    </div>




    <!-- Response Box -->

    <div class="response-box">


        <h3>JARVIS</h3>


        <p id="response">
            Welcome back, sir...
        </p>


    </div>





    <!-- Bottom Controls -->

    <div class="controls">


        <button id="mic">
            🎤
        </button>


        <button id="search">
            🔍
        </button>


        <button id="settings">
            ⚙️
        </button>


    </div>



</div>



<script src="script.js"></script>


</body>

</html>
